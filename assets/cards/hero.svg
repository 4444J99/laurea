    <text class="ev" text-anchor="middle" x="0" y="22"><tspan x="0" dy="0">non-fork repositories</tspan><tspan x="0" dy="14">visible corpus</tspan></text>
  </g>
  <g class="fade d3" transform="translate(110, 222)">
