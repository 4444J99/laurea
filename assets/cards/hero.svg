<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" role="img" aria-label="Measured GitHub activity profile">
  <style>
    .t { font: 600 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .big { font: 700 34px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e3b341; }
    .status, .tier { font: 700 13px 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 1px; }
    .ev { font: 400 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
    .fade { opacity: 1; }
  </style>
  <defs>
  <linearGradient id="shH" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#9e7b2a"/>
    <stop offset="50%" stop-color="#e3b341">
      <animate attributeName="offset" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#9e7b2a"/>
  </linearGradient>

  <linearGradient id="shL" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#9e7b2a"/>
    <stop offset="50%" stop-color="#e3b341">
      <animate attributeName="offset" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#9e7b2a"/>
  </linearGradient>
</defs>
  <rect width="419" height="299" x="0.5" y="0.5" rx="12" fill="#0d1117" stroke="#30363d"/>
  <g transform="translate(210,40) scale(0.5)"><g transform="translate(-16,0)"><path d="M0,4 Q-3,-18 2,-42" stroke="url(#shL)" stroke-width="2" fill="none"/><ellipse cx="0" cy="-8" rx="6" ry="2.6" transform="rotate(-24 0 -8)" fill="url(#shL)"/><ellipse cx="0" cy="-15" rx="6" ry="2.6" transform="rotate(-29 0 -15)" fill="url(#shL)"/><ellipse cx="0" cy="-22" rx="6" ry="2.6" transform="rotate(-34 0 -22)" fill="url(#shL)"/><ellipse cx="0" cy="-29" rx="6" ry="2.6" transform="rotate(-39 0 -29)" fill="url(#shL)"/><ellipse cx="0" cy="-36" rx="6" ry="2.6" transform="rotate(-44 0 -36)" fill="url(#shL)"/></g><g transform="translate(16,0) scale(-1,1)"><path d="M0,4 Q-3,-18 2,-42" stroke="url(#shL)" stroke-width="2" fill="none"/><ellipse cx="0" cy="-8" rx="6" ry="2.6" transform="rotate(-24 0 -8)" fill="url(#shL)"/><ellipse cx="0" cy="-15" rx="6" ry="2.6" transform="rotate(-29 0 -15)" fill="url(#shL)"/><ellipse cx="0" cy="-22" rx="6" ry="2.6" transform="rotate(-34 0 -22)" fill="url(#shL)"/><ellipse cx="0" cy="-29" rx="6" ry="2.6" transform="rotate(-39 0 -29)" fill="url(#shL)"/><ellipse cx="0" cy="-36" rx="6" ry="2.6" transform="rotate(-44 0 -36)" fill="url(#shL)"/></g></g>
  <text class="status fade" fill="url(#shH)" text-anchor="middle" x="210" y="82" style="font-size:16px">MEASURED GITHUB ACTIVITY PROFILE</text>
  <text class="ev fade d1" text-anchor="middle" x="210" y="102"><tspan x="210" dy="0">GitHub activity does not establish authorship,</tspan><tspan x="210" dy="15">quality, reliability, adoption, or impact.</tspan></text>
  
  <g class="fade d1" transform="translate(105, 152)">
    <text class="big" text-anchor="middle" x="0">54,553</text>
    <text class="ev" text-anchor="middle" x="0" y="24"><tspan x="0" dy="0">contribution events</tspan><tspan x="0" dy="14">trailing 12 months</tspan></text>
  </g>
  <g class="fade d2" transform="translate(315, 152)">
    <text class="big" text-anchor="middle" x="0">60</text>
    <text class="ev" text-anchor="middle" x="0" y="24"><tspan x="0" dy="0">non-fork repositories</tspan><tspan x="0" dy="14">visible corpus</tspan></text>
  </g>
  <g class="fade d3" transform="translate(105, 222)">
    <text class="big" text-anchor="middle" x="0">1,806</text>
    <text class="ev" text-anchor="middle" x="0" y="24"><tspan x="0" dy="0">pull requests opened</tspan><tspan x="0" dy="14">trailing 12 months</tspan></text>
  </g>
  <g class="fade d4" transform="translate(315, 222)">
    <text class="big" text-anchor="middle" x="0">10</text>
    <text class="ev" text-anchor="middle" x="0" y="24"><tspan x="0" dy="0">organization memberships</tspan><tspan x="0" dy="14">queried</tspan></text>
  </g>
  <text class="ev fade d4" text-anchor="middle" x="210" y="288">LAVREA · generated for @4444J99 · 4444J99/laurea</text>
