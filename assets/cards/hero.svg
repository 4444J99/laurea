    <text class="ev" text-anchor="middle" x="0" y="22"><tspan x="0" dy="0">pull requests opened</tspan><tspan x="0" dy="14">trailing 12 months</tspan></text>
  </g>
  <g class="fade d4" transform="translate(310, 222)">
