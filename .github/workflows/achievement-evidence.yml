name: achievement-evidence
# Receipt: green progress polish 2026-11-01 — align to actions/checkout@v7 and setup-python@v7 (Node 24) for consistency with laurea.yml after successful run on ea60e4d.

on:
  pull_request:
    paths:
      - 'evidence/**'
      - 'scripts/verify_achievements.py'
      - 'tests/test_achievement_evidence.py'
      - '.github/workflows/achievement-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'evidence/**'
      - 'scripts/verify_achievements.py'
      - 'tests/test_achievement_evidence.py'
      - '.github/workflows/achievement-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/verify_achievements.py
      - run: python -m unittest discover -s tests -p test_achievement_evidence.py -v
