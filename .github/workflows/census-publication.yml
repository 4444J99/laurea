name: census-publication
# Receipt: green progress polish 2026-11-01 — align to actions/checkout@v7 and setup-python@v7 (Node 24) for consistency with laurea.yml, achievement-evidence.yml and public-highlights.yml after successful public-highlights run on 2966ae2.

on:
  pull_request:
    paths:
      - 'evidence/2026-09-24-source-census.json'
      - 'evidence/source-census-2026-09-24/**'
      - 'SOURCE_CENSUS.md'
      - 'README.md'
      - 'docs/stat-blocks/**'
      - 'scripts/render_source_census.py'
      - 'tests/test_census_publication.py'
      - '.github/workflows/census-publication.yml'
  push:
    branches: [main]
    paths:
      - 'evidence/2026-09-24-source-census.json'
      - 'evidence/source-census-2026-09-24/**'
      - 'SOURCE_CENSUS.md'
      - 'README.md'
      - 'docs/stat-blocks/**'
      - 'scripts/render_source_census.py'
      - 'tests/test_census_publication.py'
      - '.github/workflows/census-publication.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/render_source_census.py --check
      - run: python -m unittest discover -s tests -p test_census_publication.py -v
