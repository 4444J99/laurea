name: source-census
on:
  pull_request:
    paths: ['scripts/source_census.py', 'tests/test_source_census.py', '.github/workflows/source-census.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Census regression tests
        run: python -m unittest discover -s tests -p test_source_census.py -v
      - name: Public source enumeration
        run: python scripts/source_census.py --output census-output
      - name: Validate canonical skill structures
        run: |
          set -o pipefail
          python census-output/skills-source/scripts/validate_skills.py --unique | tee census-output/skills-validator.log
      - name: Package this exact collector and existing verification sources
        if: always()
        run: |
          mkdir -p census-output/collector-source
          cp -r .github scripts tests src evidence docs pyproject.toml census-output/collector-source/
          cp README.md DISTINCTIONS.md STATISTICS.md census-output/collector-source/
          git rev-parse HEAD > census-output/checkout-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-census-${{ github.run_id }}
          path: census-output/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
