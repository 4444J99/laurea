name: public-highlights
# Receipt: green progress polish 2026-11-01 — align to actions/checkout@v7 and setup-python@v7 (Node 24) for consistency with laurea.yml and achievement-evidence.yml after successful achievement-evidence run on 5f16a4f.

on:
  pull_request:
    paths:
      - 'README.md'
      - 'evidence/**'
      - 'scripts/render_highlights.py'
      - 'scripts/derive_multi_axis_statistics.py'
      - 'tests/test_public_highlights.py'
      - '.github/workflows/public-highlights.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'evidence/**'
      - 'scripts/render_highlights.py'
      - 'scripts/derive_multi_axis_statistics.py'
      - 'tests/test_public_highlights.py'
      - '.github/workflows/public-highlights.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-highlights:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/render_highlights.py --check
      - run: python scripts/derive_multi_axis_statistics.py
      - run: python -m unittest discover -s tests -p 'test_public_highlights.py' -v
