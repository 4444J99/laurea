name: distinction-atlas
# Receipt: green progress polish 2026-11-01 — align to actions/checkout@v7 and setup-python@v7 (Node 24) for consistency with census-publication.yml after successful census-publication run on 140aec0.

on:
  pull_request:
    paths:
      - 'evidence/**'
      - 'DISTINCTIONS.md'
      - 'scripts/build_distinction_atlas.py'
      - 'tests/test_distinction_atlas.py'
      - '.github/workflows/distinction-atlas.yml'
  push:
    branches: [main]
    paths:
      - 'evidence/**'
      - 'DISTINCTIONS.md'
      - 'scripts/build_distinction_atlas.py'
      - 'tests/test_distinction_atlas.py'
      - '.github/workflows/distinction-atlas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/build_distinction_atlas.py --check
      - run: python -m unittest discover -s tests -p 'test_distinction_atlas.py' -v
